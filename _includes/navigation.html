<nav class="content-grid">
    <ul class="grid-9-column">
        <li class="logo">
            <a href="/index.html" target="_self">
                &#128640;
                <span class="visually-hidden">Home</span>
            </a>
        </li>

        {% for link in site.data.nav.pages %}
            <li><a href="{{ link.link }}" target="_self">{{ link.name }}</a></li>
        {% endfor %}

        <li class="socials" aria-label="Social Media">
            {% for link in site.data.nav.social-media %}
                <a href="{{ link.link }}" target="_self">
                    <span class="visually-hidden">{{ link.name }}</span>
                    {{ link.svg }}
                </a>
            {% endfor %}
        </li>
    </ul>
</nav>
